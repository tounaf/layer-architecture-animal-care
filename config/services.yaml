services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Configuration des couches principales
    Domain\:
        resource: '../src/Domain/'

    Application\:
        resource: '../src/Application/'

    Application\RendezVous\Handler\:
        resource: '../src/Application/RendezVous/Handler/'
        tags: ['messenger.message_handler']

    Application\User\Handler\:
        resource: '../src/Application/User/Handler/'
        tags: ['messenger.message_handler']

    Infrastructure\:
        resource: '../src/Infrastructure/'
        exclude: '../src/Infrastructure/File/'

    Infrastructure\File\FileUploader:
        arguments:
            $targetDirectory: '%kernel.project_dir%/public/uploads'

    UI\:
        resource: '../src/UI/'

    # Liaison Interface -> Implémentation
    Application\Shared\Bus\EventBusInterface: '@Infrastructure\Messenger\SymfonyMessengerEventBus'
    Domain\RendezVous\Repository\RendezVousRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrineRendezVousRepository'
    Domain\Client\Repository\ClientRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrineClientRepository'
    Domain\Animal\Repository\AnimalRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrineAnimalRepository'
    Domain\Prestataire\Repository\PrestataireRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrinePrestataireRepository'
    Domain\Prestataire\Repository\ServiceProposeRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrineServiceProposeRepository'
    Domain\Prestation\Repository\PrestationRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrinePrestationRepository'
    Domain\Care\Repository\CarnetSanteRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrineCarnetSanteRepository'
    Domain\Document\Repository\DocumentRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrineDocumentRepository'
    Domain\Service\Repository\ServiceRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrineServiceRepository'
    Domain\Service\Repository\ServiceCategorieRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrineServiceCategorieRepository'
    Domain\Service\Repository\ServiceChampRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrineServiceChampRepository'
    Domain\User\Repository\UserRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrineUserRepository'
    Domain\User\Repository\GroupRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrineGroupRepository'
    Domain\User\Repository\ProfileRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrineProfileRepository'
    Domain\User\Repository\RightRepositoryInterface: '@Infrastructure\Persistence\Doctrine\Repository\DoctrineRightRepository'
